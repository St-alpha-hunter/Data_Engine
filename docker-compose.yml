services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"   # HTTP 接口（clickhouse_connect 用这个）
      - "9000:9000"   # 原生 TCP 接口（clickhouse-client 用这个）
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d   # 首次启动时执行的建库 SQL
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5433:5432"   # 本机已有原生 PostgreSQL 15 占用 5432，这里映射到 5433
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d   # 首次启动时执行的初始化 SQL

  # ===================== Airflow 3.3.2（LocalExecutor，不需要 Celery / Redis）=====================
  # 镜像：docker/airflow/Dockerfile（官方镜像 + 项目依赖）；元数据库：postgres 容器里的 airflow 库
  # 项目目录挂到 /opt/airflow/project，任务直接调用 pipelines/ 里的函数；DAG 放项目的 dags/ 目录
  # 网页：http://localhost:8081（本机 8080 被 httpd 占用）；本地使用，不需要登录
  airflow-init:
    &airflow-common
    build: ./docker/airflow
    image: data-engine-airflow:3.3.2
    env_file: .env                         # FMP_API_KEY、SEC_USER_AGENT、数据库密码等
    environment:
      &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Shanghai
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      # 容器里连数据库用容器名和容器内端口（覆盖 .env 里给本机用的 localhost:5433）
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      KAFKA_BOOTSTRAP: kafka:9092                       # 5 分钟线推进 Kafka（publish_intraday）
      PYTHONPATH: /opt/airflow/project
    volumes:
      - .:/opt/airflow/project
      - ./dags:/opt/airflow/dags
      - ./data/airflow/logs:/opt/airflow/logs
    depends_on:
      - postgres
      - clickhouse
    # 初始化 / 升级元数据库，并确保资源池 fmp 存在（1 个位置：同一时间只允许一个任务请求 FMP，避免触发限流）；跑完就退出
    entrypoint: /bin/bash
    command: ["-c", "airflow db migrate && airflow pools set fmp 1 'FMP API：同一时间只允许一个任务请求'"]
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    entrypoint: ["/usr/bin/dumb-init", "--", "/entrypoint"]   # 官方镜像的入口；不写会继承上面 airflow-init 的 /bin/bash
    command: api-server
    ports:
      - "8081:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    entrypoint: ["/usr/bin/dumb-init", "--", "/entrypoint"]   # 官方镜像的入口；不写会继承上面 airflow-init 的 /bin/bash
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    entrypoint: ["/usr/bin/dumb-init", "--", "/entrypoint"]   # 官方镜像的入口；不写会继承上面 airflow-init 的 /bin/bash
    command: dag-processor
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ===================== Superset 6.1.0（看板）=====================
  # 镜像：docker/superset/Dockerfile（官方镜像 + PostgreSQL / ClickHouse 驱动）；元数据库：postgres 容器里的 superset 库
  # 连数据用只读账号 superset_ro（PostgreSQL 的 meta / ref / events、airflow 运行记录；ClickHouse 的 raw / golden）
  # 网页：http://localhost:8088，管理员 admin，密码见 .env 的 SUPERSET_ADMIN_PASSWORD
  superset:
    build: ./docker/superset
    image: data-engine-superset:6.1.0
    env_file: .env
    ports:
      - "8088:8088"
    volumes:
      - ./docker/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./docker/superset/bootstrap.sh:/app/project-bootstrap.sh:ro
    entrypoint: ["/bin/bash", "/app/project-bootstrap.sh"]
    depends_on:
      - postgres
      - clickhouse
    restart: unless-stopped

  # ===================== 流处理：Kafka + Spark（常驻；每日流程的 5 分钟线经过这里）=====================
  # 流程见 docs/streaming.md：5 分钟线推进 Kafka → Spark Structured Streaming 清洗校验、合成 15min / 1h / 1d → 湖的 silver
  # 两个服务合计约 2–3.5 GB 内存，只在本地跑（云上 4G 的机器不放）
  #
  # Kafka 3.9.1，KRaft 模式（自己选主，不需要 ZooKeeper），单节点
  #   容器之间（Spark、Airflow）连 kafka:9092；本机（回放程序）连 localhost:9094
  #   数据卷 kafka_data：重启不丢消息（Spark 流任务的检查点记着读到了哪）；消息保留 7 天
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"         # 主题由回放程序按约定的分区数创建，拼错名字不会悄悄建一个新的
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  # Spark 3.5.8 + Delta 3.3.2（镜像 docker/spark/Dockerfile），单机 local[*] 模式
  # 容器一启动就跑流任务 spark_jobs/bars.py stream（挂了自动重启，检查点保证接着上次读）；Spark 网页 http://localhost:4040
  # 其他任务（verify / rebuild / selftest）用 docker compose exec spark /opt/spark/bin/spark-submit … 另外提交
  # 读交易日历用只读账号 superset_ro（只有 ref 等 schema 的读权限）；质量问题由 Airflow 的 sync_intraday 写 meta，Spark 不写数据库
  spark:
    build: ./docker/spark
    image: data-engine-spark:3.5.8
    command: ["/opt/spark/bin/spark-submit", "--driver-memory", "2g", "spark_jobs/bars.py", "stream"]
    working_dir: /opt/project
    ports:
      - "4040:4040"
    environment:
      PYTHONPATH: /opt/project
      LAKEHOUSE_DIR: /opt/project/data/lakehouse
      KAFKA_BOOTSTRAP: kafka:9092
      PG_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      PG_RO_USER: superset_ro
      PG_RO_PASSWORD: ${SUPERSET_RO_PASSWORD}
    volumes:
      - .:/opt/project
    depends_on:
      - kafka
      - postgres
    restart: unless-stopped

volumes:
  kafka_data:
  clickhouse_data:
  postgres_data:
